    <title>Expense Ledger</title>
    <!-- Run 40: the opening mark, drawn before any script runs (copied from screens/launch.js; a test checks they stay identical) -->
    <style id="launch-css">#launch{position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;background:var(--bg,#07151A);transition:opacity 380ms cubic-bezier(.4,0,.2,1) 140ms;-webkit-tap-highlight-color:transparent}#launch .launch-in{position:relative;display:flex;flex-direction:column;align-items:center;transition:transform 420ms cubic-bezier(.2,.8,.2,1),opacity 300ms ease-out 60ms}#launch .launch-mark{display:block}#launch .launch-name{position:absolute;top:100%;margin-top:18px;white-space:nowrap;font:600 19px/1.2 Onest,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;letter-spacing:.2px;color:var(--ink,#F3F7F6);opacity:0;transform:translateY(6px);animation:launchName 360ms cubic-bezier(.2,.8,.2,1) 160ms forwards}#launch.out{opacity:0;pointer-events:none}#launch.out .launch-in{transform:translateY(-44px) scale(.9);opacity:0}@keyframes launchName{to{opacity:1;transform:none}}@keyframes launchGone{to{opacity:0;visibility:hidden}}#launch{animation:launchGone 300ms ease-out 2600ms forwards}html.launch-rise #root{animation:launchFade 380ms ease-out 100ms both}html.launch-rise .page{animation:launchRise 460ms cubic-bezier(.2,.8,.2,1) 120ms both}@keyframes launchFade{from{opacity:0}to{opacity:1}}@keyframes launchRise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}@media (prefers-reduced-motion: reduce){#launch,#launch .launch-in{transition:opacity 200ms linear}#launch .launch-name{animation:none;opacity:1;transform:none}#launch.out .launch-in{transform:none}html.launch-rise #root,html.launch-rise .page{animation:none}}html[data-fx=off] #launch,html[data-fx=off] #launch .launch-in{transition:opacity 200ms linear}html[data-fx=off] #launch .launch-name{animation:none;opacity:1;transform:none}html[data-fx=off] #launch.out .launch-in{transform:none}html[data-fx=off].launch-rise #root,html[data-fx=off].launch-rise .page{animation:none}</style>
    <script type="module" src="/main.jsx"></script>
  </head>
  <body>
